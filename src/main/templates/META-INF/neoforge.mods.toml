# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml

# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# A version range to match for said mod loader - for regular FML @Mod it will be the FML version. This is currently 2.
loaderVersion="${loader_version_range}" #mandatory

# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
license="${mod_license}"

# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory

# The modid of the mod
modId="${mod_id}" #mandatory

# The version number of the mod
version="${mod_version}" #mandatory

# A display name for the mod
displayName="${mod_name}" #mandatory

# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

# A URL for the "homepage" for this mod, displayed in the mod UI
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional

# A file name (in the root of the mod JAR) containing a logo for display
logoFile="${mod_logo_file}"

# A text field displayed in the mod UI
#credits="" #optional

# The authors of the mod, displayed in the mod UI (optional)
authors="${mod_authors}"

# The description text for the mod (multi line!) (#mandatory)
description='''${mod_description}'''


# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# The coremods config file path is not configurable and is always loaded from META-INF/coremods.json

# The mixins config file to load
[[mixins]]
config = "beloong.mixins.json"

[[mixins]]
config = "beloong.healthbars.mixins.json"

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.${mod_id}]] #optional
    # the modid of the dependency
    modId="neoforge" #mandatory
    # The type of the dependency. Can be one of "required", "optional", "incompatible" or "discouraged" (case insensitive).
    # 'required' requires the mod to exist, 'optional' does not
    # 'incompatible' will prevent the game from loading when the mod exists, and 'discouraged' will show a warning
    type="required" #mandatory
    # Optional field describing why the dependency is required or why it is incompatible
    # reason="..."
    # The version range of the dependency
    versionRange="[${neo_version},)" #mandatory
    # An ordering relationship for the dependency.
    # BEFORE - This mod is loaded BEFORE the dependency
    # AFTER - This mod is loaded AFTER the dependency
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT, or SERVER
    side="BOTH"

# Here's another dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    # This version range declares a minimum of the current minecraft version up to but not including the next major version
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="cataclysm"
    type="required"
    versionRange="[3.26,)"
    ordering="AFTER"
    side="BOTH"

# LionfishAPI —— 地狱之门的模型/动画基类来自它。
# 灾变的 mods.toml 里没写这个依赖（它只声明 curios），但灾变 3.26 的模型体系实际依赖它，
# 而本模组的地狱之门直接链接了它的类，所以这里显式声明为 required：
# 缺了它宁可给出清晰的加载错误，也不要运行时 NoClassDefFoundError。
# 下界取 "3.0-beta"（而非 "3.0"）是因为 LionfishAPI 当前发布版正好叫 3.0-beta，
# 而这个字符串在版本比较里小于 "3.0"，用 [3.0,) 会把编译时的那个版本自己挡在门外。
[[dependencies.${mod_id}]]
    modId="lionfishapi"
    type="required"
    versionRange="[3.0-beta,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="fdbosses"
    type="required"
    versionRange="[3.1.0,)"
    ordering="AFTER"
    side="BOTH"

# FDLib — 必选前置（2026-09-30 新增，理由见 docs/plans/2026-09-30-cg-system-design.md 的 D1）。
# 它的 systems/cutscenes/（过场系统）是 CG 系统的相机底座。
# 版本号取自实际下载并开箱核对过的 jar（CF 文件 7844741）：modId=fdlib、mod_version=1.0.9。
# 注：fdbosses 自身 required fdlib，故此处是把既有传递依赖显式化，不是新增约束。
[[dependencies.${mod_id}]]
    modId="fdlib"
    type="required"
    versionRange="[1.0.9,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="dragonsurvival"
    type="required"
    versionRange="[2.0.53,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[4.6,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="waystones"
    type="required"
    versionRange="[21.1.40,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ftbchunks"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="biomeswevegone"
    type="required"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="terrablender"
    type="required"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="beyonddimensions"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="lockdown"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="yungsapi"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="betterendisland"
    type="optional"
    ordering="AFTER"
    side="BOTH"

# Mowzie's Mobs — 必选依赖。**上界刻意收紧到 1.9**：
# 本模组对它有 6 处注入（4 个太阳技能的伤害类型转换 + 耀斑的基准伤害/半径字面量锚点）。
# `injectors.defaultRequire = 1` 只能保证"方法结构变了会在启动期硬崩"；收紧上界可让
# "上游改了被锚定的字面量 / 新增同名伤害类型 id"这类**静默漂移**也在启动期暴露
# （届时按 docs/plans/2026-10-09-solar-flare-tuning.md 与调研文档重新反编译核对注入点）。
[[dependencies.${mod_id}]]
    modId="mowziesmobs"
    type="required"
    versionRange="[1.8.2,1.9)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="legendary_monsters"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    type="required"
    versionRange="[1.21.1-3.16.3,)"
    ordering="AFTER"
    side="BOTH"

# ChatBox（视觉小说式对话框）—— 必选依赖。
# 版本号取自实际下载的 jar（CF 文件 8947867）：modId=chatbox、version=1.1.5。
# 它自身只 required neoforge >=21.1.199 与 minecraft [1.21,1.22)，
# KubeJS / GeckoLib / watermedia / terra_entity 均为软依赖（其 mods.toml 未声明），
# 故本模组只需声明 chatbox 本身，不必连带声明它们。
[[dependencies.${mod_id}]]
    modId="chatbox"
    type="required"
    versionRange="[1.1.5,)"
# Raids:Enhanced（袭击增强）— 可选兼容：让它的袭击者把龙之生存猎人视为同伴。
# 注入的是该模组的内部方法 RaidBlimp#checkTargetClass，上游改名会静默失效，
# 因此这里写 versionRange 让「版本不匹配」在启动日志里可见（见 2026-09-18 审查第 2 条）。
[[dependencies.${mod_id}]]
    modId="raidsenhanced"
    type="optional"
    versionRange="[1.0.2,)"
    ordering="AFTER"
    side="BOTH"

# Bosses'Rise（首领崛起）— 可选兼容：让"可破防"标签（beloong:underworld_knight_guard_break）
# 里的伤害击穿冥界骑士（赫尔瓦）的护盾，每次命中扣 1 层免疫层数。
# 注入的是 UnderworldKnightEntity#hurt（HEAD，cancellable）。
# **与必选依赖 mowziesmobs 不同，这里刻意只锁下界、不收紧上界**：本依赖是可选兼容，
# 缺失/版本不匹配时该 Mixin 整体跳过（特性关闭），并会因"日志锚点消失"被察觉 —— 这是预期行为，
# 而不是需要拦下的错误。已从该 jar 的 META-INF/neoforge.mods.toml 核实：
# modId=block_factorys_bosses、version=2.1.2。
[[dependencies.${mod_id}]]
    modId="block_factorys_bosses"
    type="optional"
    versionRange="[2.1.2,)"
    ordering="AFTER"
    side="BOTH"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features.${mod_id}]
#openGLVersion="[3.2,)"
